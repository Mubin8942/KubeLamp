name: release

# Actions tab → "release" → Run workflow (enter a version), or push a tag v*.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version / tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet . && go test ./...
      - name: Build
        run: |
          mkdir -p dist
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            dir=dist/kubelamp-${VERSION}-${os}-${arch}
            mkdir -p $dir
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o $dir/kubelamp$ext .
            cp README.md LICENSE $dir/
            (cd dist && zip -qr $(basename $dir).zip $(basename $dir))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kubelamp-${{ env.VERSION }}
          path: dist/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: KubeLamp ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          body: |
            Download the zip for your OS, unzip, and run `kubelamp` (Windows: `kubelamp.exe`).
            It opens http://127.0.0.1:7080 and reads `~/.kube/config` (or `-kubeconfig <path>`).

            **Docker:** `docker run -p 7080:7080 --user $(id -u):$(id -g) -v ~/.kube:/kube:ro -v kubelamp-data:/data ghcr.io/zanayeem/kubelamp`
            (also on Docker Hub; the image includes kubectl and the AWS CLI for EKS logins).
            Inside Kubernetes: see `deploy/kubernetes/` in the repository.

  macos-dmg:
    needs: build
    runs-on: macos-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build universal KubeLamp.app + DMG
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q ds_store
          /tmp/venv/bin/python packaging/macos/build_dmg.py --version "${VERSION#v}" --out dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*.dmg

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          v=${VERSION#v}; mm=${v%.*}
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repos="ghcr.io/$owner/kubelamp"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            repos="$repos docker.io/$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')/kubelamp"
          else
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are not set: pushing to GHCR only"
          fi
          slim=""
          for r in $repos; do
            slim="$slim,$r:$v,$r:$mm,$r:latest"
          done
          echo "slim=${slim#,}" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.slim }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
      - name: Smoke test the pushed image
        run: |
          v=${{ steps.tags.outputs.version }}
          img=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/kubelamp:$v
          docker run -d --name kl -p 7080:7080 "$img"
          for i in $(seq 1 20); do curl -fsS localhost:7080/healthz && break; sleep 1; done
          curl -fsS localhost:7080/healthz | grep -q "\"version\":\"$v\""
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:7080/api/clusters)" = 401
          docker logs kl
