name: ci

# Tests and a Docker build check (no push) on every push to main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./... && go test ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: kubelamp:ci
      - name: Run the image
        run: |
          for img in kubelamp:ci; do
            docker run -d --name kl --read-only -p 7080:7080 -v kldata:/data "$img"
            for i in $(seq 1 20); do curl -fsS localhost:7080/healthz && break; sleep 1; done
            curl -fsS localhost:7080/healthz
            test "$(curl -s -o /dev/null -w '%{http_code}' localhost:7080/api/clusters)" = 401
            docker exec kl /usr/local/bin/kubelamp -healthcheck
            docker logs kl
            docker rm -f kl; docker volume rm kldata
          done
          docker run --rm --entrypoint kubectl kubelamp:ci version --client
          docker run --rm --entrypoint aws kubelamp:ci --version
          docker images | grep kubelamp
