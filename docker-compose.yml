# KubeLamp with Docker Compose. Open the URL and upload or paste your kubeconfig;
# it is kept in the kubelamp-data volume.
#   docker compose up -d
#   docker compose logs kubelamp      # shows the URL with the access token
services:
  kubelamp:
    image: ghcr.io/zanayeem/kubelamp:latest      # or docker.io/<user>/kubelamp, or build: .
    container_name: kubelamp
    restart: unless-stopped
    # user: "${UID:-1000}:${GID:-1000}"           # only if you mount ~/.kube below (600-mode files)
    ports:
      - "7080:7080"
    environment:
      KUBELAMP_READ_ONLY: "false"
      # KUBELAMP_TOKEN: "choose-a-long-random-token"   # otherwise one is generated and kept in /data/token
    volumes:
      # - ${HOME}/.kube:/kube:ro                   # optional: then enter /kube/config under "File path"
      - kubelamp-data:/data
      # - ${HOME}/.aws:/home/kubelamp/.aws:ro       # EKS: aws credentials
    read_only: true
    security_opt: ["no-new-privileges:true"]
volumes:
  kubelamp-data:
