<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KubeLamp</title>
<meta name="theme-color" content="#0f141b">
<link rel="icon" type="image/png" href="favicon.png">
<script>
// served under a sub-path without the trailing slash (https://host/kubelamp): add it, so
// the relative links to scripts, styles and the API resolve inside that folder
if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
</script>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="side" id="side">
  <a class="brand" href="#/">
    <img src="logo.png" alt="" width="30" height="30">
    <span>KubeLamp</span>
  </a>
  <nav id="nav" aria-label="Sections"></nav>
  <nav id="rail" aria-label="Sections (collapsed)"></nav>
  <div class="side-foot"><button class="side-tog" id="sideTog" type="button"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/><path id="sideTogArrow" d="M15.5 10l-2 2 2 2"/></svg><span>Collapse sidebar</span></button></div>
</aside>

<header class="topbar" id="top">
  <button class="picker" id="ctxPicker" aria-haspopup="listbox" title="Switch cluster">
    <i class="dot" id="ctxDot"></i><span id="ctxName">All clusters</span><svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
  </button>
  <button class="picker" id="nsPicker" aria-haspopup="listbox" title="Namespace filter for every page" hidden>
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 9.5h17"/></svg><span id="nsName">All namespaces</span><svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
  </button>
  <span class="grow"></span>
  <span class="badge" id="roBadge" hidden title="Started with -read-only: edits, deletes, exec and the shell are disabled">Read-only</span>
  <button class="tbtn" id="toolsBtn" aria-haspopup="menu" title="Tools: networking and file tools">
    <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.7-.6-.6-2.7z"/></svg><span>Tools</span>
  </button>
  <button class="tbtn" id="termToggle" title="Terminal (Ctrl+`)">
    <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 10l3 2.5L7 15M12.5 15H17"/></svg><span>Terminal</span>
  </button>
  <a class="tbtn icon-only" id="setBtn" href="#/settings" title="Settings: theme, accent colour, glass">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </a>
  <button class="tbtn power" id="stopBtn" title="Stop the KubeLamp server">
    <svg viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M6.6 7.2a7.5 7.5 0 1 0 10.8 0"/></svg><span>Stop server</span>
  </button>
</header>

<main id="main" tabindex="-1"></main>

<section class="term" id="term" hidden aria-label="Terminal">
  <div class="term-grip" id="termGrip" title="Drag to resize"></div>
  <div class="term-bar">
    <div class="term-tabs" id="termTabs" role="tablist"></div>
    <button class="term-icon" id="termNew" title="New shell for the current cluster"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <span class="grow"></span>
    <button class="term-icon" id="termBc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M8.5 15.5a5 5 0 0 1 0-7M15.5 8.5a5 5 0 0 1 0 7M5.6 18.4a9 9 0 0 1 0-12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></svg></button>
    <button class="term-icon" id="termSplit"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M12 4.5v15M3.5 12h17"/></svg></button>
    <button class="term-icon" id="termHL"><svg viewBox="0 0 24 24"><path d="M15 4l5 5-9 9H6v-5z"/><path d="M4 21h16"/></svg></button>
    <button class="term-icon" id="termFull"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="term-icon" id="termHide" title="Hide terminal (Ctrl+`)"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
  </div>
  <div class="term-bcbar" id="termBcBar" hidden></div>
  <div class="term-body" id="termBody"></div>
</section>

<div id="pop" class="pop" hidden></div>
<div id="tip" class="tip" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/resources.js"></script>
<script src="js/termhl.js"></script>
<script src="js/terminal.js"></script>
<script src="js/nsview.js"></script>
<script src="js/filetransfer.js"></script>
<script src="js/fileexplorer.js"></script>
<script src="js/dnscheck.js"></script>
<script src="js/tools.js"></script>
<script src="js/routes.js"></script>
<script src="js/kcsetup.js"></script>
<script src="js/settings.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
