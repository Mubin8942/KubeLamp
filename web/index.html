<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KubeDeck</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23326CE5'/%3E%3Cpath d='M16 6l8.7 5v10L16 26l-8.7-5V11z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="side" id="side">
  <a class="brand" href="#/">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#326CE5"/><path d="M16 6l8.7 5v10L16 26l-8.7-5V11z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><circle cx="16" cy="16" r="3" fill="#fff"/></svg>
    <span>KubeDeck</span>
  </a>
  <nav id="nav" aria-label="Sections"></nav>
</aside>

<header class="topbar" id="top">
  <button class="picker" id="ctxPicker" aria-haspopup="listbox" title="Switch cluster">
    <i class="dot" id="ctxDot"></i><span id="ctxName">All clusters</span><svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
  </button>
  <button class="picker" id="nsPicker" aria-haspopup="listbox" title="Namespace filter for every page" hidden>
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 9.5h17"/></svg><span id="nsName">All namespaces</span><svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
  </button>
  <span class="grow"></span>
  <span class="badge" id="roBadge" hidden title="Started with -read-only: edits, deletes, exec and the shell are disabled">Read-only</span>
  <button class="tbtn" id="termToggle" title="Terminal (Ctrl+`)">
    <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 10l3 2.5L7 15M12.5 15H17"/></svg><span>Terminal</span>
  </button>
  <button class="tbtn power" id="stopBtn" title="Stop the KubeDeck server">
    <svg viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M6.6 7.2a7.5 7.5 0 1 0 10.8 0"/></svg><span>Stop server</span>
  </button>
</header>

<main id="main" tabindex="-1"></main>

<section class="term" id="term" hidden aria-label="Terminal">
  <div class="term-grip" id="termGrip" title="Drag to resize"></div>
  <div class="term-bar">
    <div class="term-tabs" id="termTabs" role="tablist"></div>
    <button class="term-icon" id="termNew" title="New shell for the current cluster"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <span class="grow"></span>
    <button class="term-icon" id="termHide" title="Hide terminal (Ctrl+`)"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
  </div>
  <div class="term-body" id="termBody"></div>
</section>

<div id="pop" class="pop" hidden></div>
<div id="tip" class="tip" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/resources.js"></script>
<script src="js/terminal.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
